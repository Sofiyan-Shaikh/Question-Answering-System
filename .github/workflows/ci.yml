name: CI Pipeline — QA System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel any in-progress run on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ── 1. Python: lint ──────────────────────────────────────────────────────
  python-lint:
    name: Python Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install flake8 black

      - name: Run flake8
        run: |
          flake8 backend/ training/ \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,*.egg-info

      - name: Run black (check only)
        run: |
          black --check --line-length=100 backend/ training/

  # ── 2. Python: unit + API tests ──────────────────────────────────────────
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest
    needs: python-lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Create .env for tests
        run: |
          cat > backend/.env << 'EOF'
          SECRET_KEY=ci-test-secret-key-not-for-production
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          API_V1_PREFIX=/api/v1
          PROJECT_NAME=QA System CI
          VERSION=1.0.0
          MODEL_NAME=bert-base-uncased
          MODEL_VERSION=bert-base-squad2-v1
          MAX_LENGTH=512
          DOC_STRIDE=128
          DEVICE=cpu
          NULL_THRESHOLD=-2.35
          BACKEND_CORS_ORIGINS=["http://localhost:3000"]
          EOF

      - name: Run API boundary tests (mock predictor — no model download)
        run: |
          python -m pytest backend/tests/test_api.py \
            -v \
            -k "not TestPredictorService" \
            --tb=short \
            --no-header

      - name: Run threshold unit tests
        run: |
          python -m pytest backend/tests/test_model.py::TestNullThreshold \
            -v \
            --tb=short \
            --no-header

      - name: Run offset mapping unit tests
        run: |
          python -m pytest backend/tests/test_model.py::TestOffsetMapping \
            -v \
            --tb=short \
            --no-header

  # ── 3. React: lint ───────────────────────────────────────────────────────
  react-lint:
    name: React Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --silent

      - name: Run ESLint
        run: |
          npx eslint src/ \
            --ext .ts,.tsx \
            --max-warnings=0 \
            --no-error-on-unmatched-pattern || true

  # ── 4. React: build verification ─────────────────────────────────────────
  react-build:
    name: React Build Verification
    runs-on: ubuntu-latest
    needs: react-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --silent

      - name: Set environment for build
        run: echo "REACT_APP_API_URL=http://localhost:8000" >> .env

      - name: Build React app
        run: npm run build

      - name: Verify build output exists
        run: |
          test -d build && echo "Build directory exists" || exit 1
          test -f build/index.html && echo "index.html exists" || exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/build/
          retention-days: 7

  # ── 5. Docker: build verification ────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [python-tests, react-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: qa-system:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — container starts and health check passes
        run: |
          docker run -d \
            --name qa-ci-test \
            -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-test-key \
            -e DEVICE=cpu \
            -e NULL_THRESHOLD=-2.35 \
            qa-system:ci-${{ github.sha }}

          # Wait for the server to start (max 90 s)
          echo "Waiting for server to start..."
          for i in $(seq 1 18); do
            sleep 5
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Health check passed!"
              break
            fi
            echo "  Attempt $i/18 — not ready yet"
          done

          # Final check
          curl -sf http://localhost:8000/api/v1/health | python3 -m json.tool

          docker stop qa-ci-test
          docker rm  qa-ci-test

  # ── 6. ML: sanity check (model artifact loading) ─────────────────────────
  ml-sanity:
    name: ML Sanity Check
    runs-on: ubuntu-latest
    needs: python-lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ML dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers>=4.30.0 tokenizers>=0.13.3

      - name: Verify BertTokenizerFast loads and offset mapping works
        run: |
          python - << 'EOF'
          from transformers import BertTokenizerFast
          tok = BertTokenizerFast.from_pretrained("bert-base-uncased")
          enc = tok(
              "Who wrote Hamlet?",
              "William Shakespeare wrote Hamlet around 1600.",
              return_offsets_mapping=True,
              truncation="only_second",
              max_length=512,
          )
          assert "offset_mapping" in enc, "offset_mapping missing"
          assert len(enc["offset_mapping"]) > 0, "offset_mapping is empty"
          print("✓ BertTokenizerFast + offset mapping: OK")
          EOF

      - name: Verify BertForQuestionAnswering loads and runs forward pass
        run: |
          python - << 'EOF'
          import torch
          from transformers import BertForQuestionAnswering, BertTokenizerFast

          tok   = BertTokenizerFast.from_pretrained("bert-base-uncased")
          model = BertForQuestionAnswering.from_pretrained("bert-base-uncased")
          model.eval()

          enc = tok(
              "What is BERT?",
              "BERT is a transformer model by Google.",
              return_tensors="pt",
              truncation="only_second",
              max_length=128,
          )
          with torch.no_grad():
              out = model(**enc)

          assert out.start_logits is not None
          assert out.end_logits   is not None
          assert out.start_logits.shape == out.end_logits.shape
          print(f"✓ Forward pass OK — logits shape: {tuple(out.start_logits.shape)}")
          EOF
